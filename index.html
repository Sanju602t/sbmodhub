                    return d;
                } catch (e) {
                    return null;
                }
            }

            function writeAppsCache(apps) {
                try {
                    localStorage.setItem(LS_APPS, JSON.stringify({
                        ts: Date.now(),
                        apps: apps
                    }));
                } catch (e) {}
            }

            function readAppCache(slug) {
                try {
                    var raw = localStorage.getItem(LS_APP + slug);
                    if (!raw) return null;
                    var d = JSON.parse(raw);
                    if (!d || !d.app) return null;
                    return d;
                } catch (e) {
                    return null;
                }
            }

            function writeAppCache(slug, app) {
                try {
                    localStorage.setItem(LS_APP + slug, JSON.stringify({
                        ts: Date.now(),
                        app: app
                    }));
                } catch (e) {}
            }

            /* [JS-06] NORMALISATION */
            function normaliseApp(raw, fallbackSlug) {
                if (!raw || typeof raw !== 'object') return null;
                var slug = String(
                    raw.slug || raw.id || raw.key || raw.package || fallbackSlug || ''
                ).trim();
                if (!slug) return null;
                var name = String(raw.name || raw.title || raw.appName || raw.label || slug).trim();
                var icon = safeUrl(raw.icon || raw.iconUrl || raw.image || raw.logo || raw.thumbnail || raw.img);
                var description = String(raw.description || raw.shortDescription || raw.summary || raw.desc || '').trim();
                var longDescription = String(raw.longDescription || raw.fullDescription || raw.about || raw.content || '').trim();
                var version = raw.version ? String(raw.version).replace(/^v/i, '').trim() : null;
                if (version === '') version = null;
                var category = raw.category || raw.genre || raw.type || null;
                if (category) category = String(category).trim();
                var download = safeUrl(raw.download || raw.downloadUrl || raw.apk || raw.apkUrl || raw.file || raw.fileUrl || raw.link);
                var screenshots = [];
                if (Array.isArray(raw.screenshots)) screenshots = raw.screenshots.map(safeUrl).filter(Boolean);
                else if (Array.isArray(raw.images)) screenshots = raw.images.map(safeUrl).filter(Boolean);
                var features = [];
                if (Array.isArray(raw.features)) features = raw.features.map(function(f) {
                    return String(f).trim();
                }).filter(Boolean);
                else if (typeof raw.features === 'string') features = raw.features.split('\n').map(function(f) {
                    return f.trim();
                }).filter(Boolean);
                return {
                    slug: slug,
                    name: name,
                    icon: icon,
                    description: description,
                    longDescription: longDescription,
                    version: version,
                    category: category,
                    developer: raw.developer ? String(raw.developer).trim() : (raw.author ? String(raw.author).trim() : null),
                    size: raw.size ? String(raw.size).trim() : (raw.fileSize ? String(raw.fileSize).trim() : null),
                    updated: raw.updated ? String(raw.updated).trim() :
                        (raw.updatedAt ? String(raw.updatedAt).trim() :
                            (raw.date ? String(raw.date).trim() : null)),
                    download: download,
                    screenshots: screenshots,
                    features: features,
                    changelog: raw.changelog ? String(raw.changelog).trim() :
                        (raw.whatsNew ? String(raw.whatsNew).trim() : null)
                };
            }

            /* [JS-07] ICON MARKUP */
            function iconMarkup(app, extra) {
                var letter = (app.name || '?').trim().charAt(0).toUpperCase() || '?';
                var url = safeUrl(app.icon);
                var cls = 'app-icon-wrap' + (extra ? ' ' + extra : '');
                var h = '<div class="' + cls + '">';
                h += '<span class="app-icon-fallback">' + esc(letter) + '</span>';
                if (url) {
                    h += '<img class="app-icon" src="' + esc(url) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">';
                }
                h += '</div>';
                return h;
            }

            /* ═══════════════════════════════════════════════════════════════════════
               [JS-08] FIREBASE LOADERS
               ═══════════════════════════════════════════════════════════════════════ */
            function loadApps(force) {
                var cache = readAppsCache();
                if (cache && !force) {
                    state.apps = cache.apps;
                    state.loading = false;
                    render();
                }
                state.loading = !state.apps.length;

                get(ref(db, 'apps')).then(function(snapshot) {
                    if (!snapshot.exists()) throw new Error('Database me "apps" node khaali hai');
                    var data = snapshot.val();
                    var apps = [];
                    Object.keys(data).forEach(function(key) {
                        var raw = data[key];
                        if (raw && typeof raw === 'object') {
                            var merged = Object.assign({}, raw);
                            if (!merged.slug) merged.slug = key;
                            var n = normaliseApp(merged, key);
                            if (n) apps.push(n);
                        }
                    });
                    if (!apps.length) throw new Error('Database me koi valid app nahi mila');
                    // Recent first (updated field ho to sort karo)
                    apps.sort(function(a, b) {
                        if (!a.updated && !b.updated) return 0;
                        if (!a.updated) return 1;
                        if (!b.updated) return -1;
                        return String(b.updated).localeCompare(String(a.updated));
                    });
                    state.apps = apps;
                    state.loading = false;
                    state.error = null;
                    state.offline = false;
                    logDiag('Firebase se ' + apps.length + ' apps mile');
                    writeAppsCache(apps);
                    render();
                }).catch(function(err) {
                    logDiag('Firebase load fail: ' + err.message);
                    var cached = readAppsCache();
                    if (cached && cached.apps.length) {
                        state.apps = cached.apps;
                        state.loading = false;
                        state.error = null;
                        state.offline = true;
                        render();
                        return;
                    }
                    state.loading = false;
                    state.error = 'Store load nahi ho paya. ' + err.message;
                    render();
                });
            }

            function loadAppDetail(slug) {
                state.detailLoading = true;
                state.detail = null;
                state.view = 'detail';
                state.slug = slug;
                render();

                var cached = readAppCache(slug);
                if (cached) {
                    state.detail = cached.app;
                    state.detailLoading = false;
                    render();
                }

                get(ref(db, 'apps/' + slug)).then(function(snapshot) {
                    if (!snapshot.exists()) throw new Error('App database me nahi mila');
                    var raw = snapshot.val();
                    var merged = Object.assign({}, raw);
                    if (!merged.slug) merged.slug = slug;
                    var app = normaliseApp(merged, slug);
                    if (!app) throw new Error('App data invalid hai');
                    state.detail = app;
                    state.detailLoading = false;
                    writeAppCache(slug, app);
                    render();
                }).catch(function(err) {
                    logDiag('Detail load fail: ' + err.message);
                    if (state.detail) {
                        state.detailLoading = false;
                        render();
                        return;
                    }
                    var listApp = state.apps.filter(function(a) {
                        return a.slug === slug;
                    })[0];
                    if (listApp) {
                        state.detail = normaliseApp(listApp, slug);
                        state.detailLoading = false;
                        render();
                    } else {
                        state.detail = null;
                        state.detailLoading = false;
                        render();
                    }
                });
            }

            /* ═══════════════════════════════════════════════════════════════════════
               [JS-09] FILTER
               ═══════════════════════════════════════════════════════════════════════ */
            function getCategories() {
                var map = Object.create(null);
                for (var i = 0; i < state.apps.length; i++) {
                    var c = state.apps[i].category;
                    if (c) map[c] = (map[c] || 0) + 1;
                }
                return Object.keys(map).sort(function(a, b) {
                    return map[b] - map[a];
                });
            }

            function filteredApps() {
                var q = state.query.trim().toLowerCase();
                var cat = state.category;
                var list = state.apps;
                if (cat && cat !== 'all') {
                    list = list.filter(function(a) {
                        return a.category && a.category.toLowerCase() === cat.toLowerCase();
                    });
                }
                if (q) {
                    list = list.filter(function(a) {
                        return (a.name && a.name.toLowerCase().indexOf(q) !== -1) ||
                            (a.description && a.description.toLowerCase().indexOf(q) !== -1) ||
                            (a.category && a.category.toLowerCase().indexOf(q) !== -1) ||
                            (a.slug && a.slug.toLowerCase().indexOf(q) !== -1);
                    });
                }
                return list;
            }

            /* ═══════════════════════════════════════════════════════════════════════
               [JS-10] RENDER DISPATCHER
               ═══════════════════════════════════════════════════════════════════════ */
            function render() {
                if (state.view === 'generating') renderGenerating();
                else if (state.view === 'detail') renderDetail();
                else renderHome();
            }

            /* ═══════════════════════════════════════════════════════════════════════
               [JS-11] HOME
               ═══════════════════════════════════════════════════════════════════════ */
            function skeletonHome() {
                var cards = '';
                for (var i = 0; i < 8; i++) {
                    cards += '<div class="sk-card"><div class="sk sk-icon"></div><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>';
                }
                return '<div class="sk sk-hero"></div>' +
                    '<div class="sk-chips">' + '<div class="sk sk-chip"></div>'.repeat(5) + '</div>' +
                    '<div class="sk sk-section-title"></div>' +
                    '<div class="grid">' + cards + '</div>';
            }

            function renderHome() {
                var view = $('#view');
                view.className = 'view view-home';
                if (state.loading && !state.apps.length) {
                    view.innerHTML = skeletonHome();
                    return;
                }
                if (state.error && !state.apps.length) {
                    view.innerHTML = '<div class="empty-state fade-in"><div class="empty-icon">⚠️</div>' +
                        '<h2>Store load nahi ho paya</h2><p>' + esc(state.error) + '</p>' +
                        '<button class="btn-primary" id="retry-btn" type="button">Try again</button>' +
                        (state.diagnostics.length ? '<div class="diag">' + esc(state.diagnostics.join('\n')) + '</div>' : '') +
                        '</div>';
                    var rb = $('#retry-btn');
                    if (rb) rb.addEventListener('click', function() {
                        loadApps(true);
                    });
                    return;
                }
                if (!state.apps.length) {
                    view.innerHTML = '<div class="empty-state fade-in"><div class="empty-icon">📦</div>' +
                        '<h2>Abhi koi app nahi hai</h2><p>Firebase Database ke "apps" node me data add karo.</p></div>';
                    return;
                }
                var q = state.query.trim();
                var list = filteredApps();
                var parts = [];
                if (state.offline) parts.push('<div class="banner banner-warn">📡 Cached data dikha rahe hain — Firebase reachable nahi hai.</div>');
                if (!q && state.category === 'all') parts.push(renderHero());
                var cats = getCategories();
                if (cats.length > 1 && !q) {
                    var chips = '<button class="cat' + (state.category === 'all' ? ' active' : '') + '" data-cat="all" type="button">All</button>';
                    for (var i = 0; i < cats.length; i++) {
                        var c = cats[i];
                        chips += '<button class="cat' + (state.category === c ? ' active' : '') + '" data-cat="' + esc(c) + '" type="button">' + esc(c) + '</button>';
                    }
                    parts.push('<div class="cats" id="cats">' + chips + '</div>');
                }
                if (q) parts.push('<div class="section-head"><h2>“' + esc(q) + '” ke results</h2><span class="count">' + list.length + '</span></div>');
                else if (state.category !== 'all') parts.push('<div class="section-head"><h2>' + esc(state.category) + '</h2><span class="count">' + list.length + '</span></div>');
                else parts.push('<div class="section-head"><h2>All apps</h2><span class="count">' + list.length + '</span></div>');
                if (!list.length) {
                    parts.push('<div class="empty-state fade-in"><div class="empty-icon">🔍</div><h2>Koi app nahi mila</h2><p>Dusra search ya category try karo.</p></div>');
                } else {
                    parts.push('<div class="grid fade-in">' + list.map(appCardHtml).join('') + '</div>');
                }
                view.innerHTML = parts.join('');
                attachHomeHandlers();
                if (!q && state.category === 'all') setupHero();
            }

            function appCardHtml(app) {
                var meta = [];
                if (app.version) meta.push('<span>v' + esc(app.version) + '</span>');
                if (app.category) {
                    if (meta.length) meta.push('<span class="dot">·</span>');
                    meta.push('<span class="cat-tag">' + esc(app.category) + '</span>');
                }
                return '<a class="app-card" href="/p/' + encodeURIComponent(app.slug) + '" data-link data-slug="' + esc(app.slug) + '">' +
                    iconMarkup(app) +
                    '<div class="app-name">' + esc(app.name) + '</div>' +
                    (meta.length ? '<div class="app-meta">' + meta.join('') + '</div>' : '') +
                    '</a>';
            }

            /* ═══════════════════════════════════════════════════════════════════════
               [JS-12] HERO CAROUSEL
               ═══════════════════════════════════════════════════════════════════════ */
            function pickFeatured() {
                var withBoth = state.apps.filter(function(a) {
                    return a.icon && a.description;
                });
                var pool = withBoth.length >= 3 ? withBoth : state.apps.filter(function(a) {
                    return a.icon;
                });
                if (pool.length < 3) pool = state.apps;
                return pool.slice(0, 5);
            }

            function renderHero() {
                var featured = pickFeatured();
                if (!featured.length) return '';
                state.heroFeatured = featured;
                var slides = featured.map(function(app, i) {
                    var bg = app.icon ? esc(app.icon) : '';
                    var bgStyle = bg ? ' style="background-image:url(&quot;' + bg + '&quot;)"' : '';
                    var meta = [];
                    if (app.version) meta.push('<span class="chip-glass">v' + esc(app.version) + '</span>');
                    if (app.category) meta.push('<span class="chip-glass">' + esc(app.category) + '</span>');
                    return '<div class="hero-slide" data-i="' + i + '">' +
                        '<div class="hero-bg"' + bgStyle + '></div><div class="hero-shade"></div>' +
                        '<div class="hero-content">' +
                        (app.icon ? '<img class="hero-icon" src="' + esc(app.icon) + '" alt="" loading="' + (i === 0 ? 'eager' : 'lazy') + '" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">' : '') +
                        '<div class="hero-text"><span class="hero-badge"><span class="pulse"></span>Featured</span>' +
                        '<h2 class="hero-title">' + esc(app.name) + '</h2>' +
                        (app.description ? '<p class="hero-desc">' + esc(app.description) + '</p>' : '') +
                        (meta.length ? '<div class="hero-meta">' + meta.join('') + '</div>' : '') +
                        '<a class="hero-cta" href="/p/' + encodeURIComponent(app.slug) + '" data-link>' +
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>View app</a>' +
                        '</div></div></div>';
                }).join('');
                var dots = featured.map(function(_, i) {
                    return '<button class="hero-dot' + (i === 0 ? ' active' : '') + '" data-i="' + i + '" type="button" aria-label="Slide ' + (i + 1) + '"></button>';
                }).join('');
                return '<section class="hero fade-in" id="hero" aria-roledescription="carousel" aria-label="Featured apps">' +
                    '<div class="hero-track" id="hero-track">' + slides + '</div>' +
                    '<button class="hero-nav hero-prev" id="hero-prev" type="button" aria-label="Previous">‹</button>' +
                    '<button class="hero-nav hero-next" id="hero-next" type="button" aria-label="Next">›</button>' +
                    '<div class="hero-dots" id="hero-dots">' + dots + '</div></section>';
            }

            function setupHero() {
                var hero = $('#hero');
                if (!hero) return;
                var track = $('#hero-track');
                var dots = $$('.hero-dot', hero);
                var count = state.heroFeatured.length;
                if (!track || count < 1) return;
                state.heroIdx = 0;

                function goTo(i) {
                    if (count === 0) return;
                    state.heroIdx = ((i % count) + count) % count;
                    track.style.transform = 'translate3d(-' + (state.heroIdx * 100) + '%,0,0)';
                    for (var k = 0; k < dots.length; k++) dots[k].classList.toggle('active', k === state.heroIdx);
                }

                function next() {
                    goTo(state.heroIdx + 1);
                }

                function prev() {
                    goTo(state.heroIdx - 1);
                }

                function start() {
                    stop();
                    if (count > 1) state.heroTimer = setInterval(next, 5500);
                }

                function stop() {
                    if (state.heroTimer) {
                        clearInterval(state.heroTimer);
                        state.heroTimer = null;
                    }
                }

                function restart() {
                    start();
                }
                var prevBtn = $('#hero-prev'),
                    nextBtn = $('#hero-next');
                if (prevBtn) prevBtn.addEventListener('click', function() {
                    prev();
                    restart();
                });
                if (nextBtn) nextBtn.addEventListener('click', function() {
                    next();
                    restart();
                });
                for (var d = 0; d < dots.length; d++) {
                    (function(idx) {
                        dots[idx].addEventListener('click', function() {
                            goTo(idx);
                            restart();
                        });
                    })(d);
                }
                var x0 = null,
                    y0 = null,
                    dx = 0;
                hero.addEventListener('touchstart', function(e) {
                    if (e.touches.length !== 1) return;
                    x0 = e.touches[0].clientX;
                    y0 = e.touches[0].clientY;
                    dx = 0;
                    stop();
                }, {
                    passive: true
                });
                hero.addEventListener('touchmove', function(e) {
                    if (x0 === null) return;
                    dx = e.touches[0].clientX - x0;
                    var dy = Math.abs(e.touches[0].clientY - y0);
                    if (Math.abs(dx) > 40 && Math.abs(dx) > dy) {
                        if (e.cancelable) e.preventDefault();
                    }
                }, {
                    passive: false
                });
                hero.addEventListener('touchend', function() {
                    if (x0 !== null && Math.abs(dx) > 45) {
                        if (dx < 0) next();
                        else prev();
                    }
                    x0 = null;
                    dx = 0;
                    start();
                });
                hero.addEventListener('mouseenter', stop);
                hero.addEventListener('mouseleave', start);
                document.addEventListener('visibilitychange', function() {
                    if (document.hidden) stop();
                    else start();
                });
                goTo(0);
                start();
            }

            /* ═══════════════════════════════════════════════════════════════════════
               [JS-13] DETAIL
               ═══════════════════════════════════════════════════════════════════════ */
            function renderDetail() {
                var view = $('#view');
                view.className = 'view view-detail';
                if (state.detailLoading && !state.detail) {
                    view.innerHTML = '<div style="padding:20px">' +
                        '<div class="sk" style="height:140px;border-radius:26px;margin-bottom:24px"></div>' +
                        '<div class="sk sk-line" style="height:30px;width:60%;margin:0 20px 14px"></div>' +
                        '<div class="sk sk-line short" style="margin:0 20px 24px;height:14px"></div>' +
                        '<div class="sk" style="height:52px;margin:0 20px 24px;border-radius:15px"></div>' +
                        '<div class="sk" style="height:90px;margin:0 20px;border-radius:18px"></div></div>';
                    return;
                }
                var app = state.detail;
                if (!app) {
                    view.innerHTML = '<div class="empty-state fade-in"><div class="empty-icon">🔍</div>' +
                        '<h2>App nahi mila</h2><p>Shayad ye app hata diya gaya hai.</p>' +
                        '<a class="btn-primary" href="/appstore" data-link>Store pe wapas</a></div>';
                    return;
                }
                var iconUrl = safeUrl(app.icon);
                var bgStyle = iconUrl ? ' style="background-image:url(&quot;' + esc(iconUrl) + '&quot;)"' : '';
                var subParts = [];
                if (app.developer) subParts.push('<span class="dev">' + esc(app.developer) + '</span>');
                if (app.category) subParts.push('<span>' + esc(app.category) + '</span>');
                if (app.version) subParts.push('<span>v' + esc(app.version) + '</span>');
                var subLine = subParts.length ? subParts.join('<span class="sep">·</span>') : '';
                var stats = [];
                if (app.version) stats.push(['Version', 'v' + app.version]);
                if (app.size) stats.push(['Size', app.size]);
                if (app.updated) stats.push(['Updated', app.updated]);
                if (app.category) stats.push(['Category', app.category]);
                var statsHtml = '';
                if (stats.length) {
                    statsHtml = '<div class="detail-stats">' + stats.slice(0, 4).map(function(s) {
                        return '<div class="stat"><div class="stat-label">' + esc(s[0]) + '</div><div class="stat-value">' + esc(s[1]) + '</div></div>';
                    }).join('') + '</div>';
                }
                var downloadBtn = '<button class="btn-primary" id="download-btn" type="button" ' +
                    'data-slug="' + esc(app.slug) + '" aria-label="Download ' + esc(app.name) + '">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v14M5 12l7 7 7-7M5 21h14"/></svg>Download</button>';
                var screenshotsHtml = '';
                if (app.screenshots && app.screenshots.length) {
                    screenshotsHtml = '<div class="detail-section"><h2>Screenshots</h2><div class="shots">' +
                        app.screenshots.map(function(s) {
                            return '<img class="shot" src="' + esc(s) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">';
                        }).join('') + '</div></div>';
                }
                var desc = app.longDescription || app.description || '';
                var descHtml = '';
                if (desc) {
                    descHtml = '<div class="detail-section"><h2>Is app ke baare mein</h2>' +
                        '<p class="detail-desc clamped" id="desc-body">' + esc(desc) + '</p>' +
                        '<button class="read-more" id="read-more" type="button" hidden>Read more</button></div>';
                }
                var featuresHtml = '';
                if (app.features && app.features.length) {
                    featuresHtml = '<div class="detail-section"><h2>Features</h2><ul class="feature-list">' +
                        app.features.map(function(f) {
                            return '<li>' + esc(f) + '</li>';
                        }).join('') + '</ul></div>';
                }
                var changelogHtml = '';
                if (app.changelog) {
                    changelogHtml = '<div class="detail-section"><h2>Naya kya hai</h2><div class="changelog">' + esc(app.changelog) + '</div></div>';
                }
                var banner = '';
                if (state.offline) banner = '<div class="banner banner-warn" style="margin:14px 20px 0">📡 Cached data dikha rahe hain.</div>';
                view.innerHTML =
                    '<div class="detail-hero"><div class="detail-hero-bg"' + bgStyle + '></div><div class="detail-hero-shade"></div>' +
                    '<div class="detail-topbar">' +
                    '<a class="back-btn" href="/appstore" data-link>' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Back</a>' +
                    '<button class="detail-share" id="share-btn" type="button" aria-label="Share">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4M12 2v14"/></svg></button></div>' +
                    '<div class="detail-main">' + iconMarkup(app, 'detail-icon-wrap') +
                    '<div class="detail-info"><h1 class="detail-name">' + esc(app.name) + '</h1>' +
                    (subLine ? '<div class="detail-sub">' + subLine + '</div>' : '') + '</div></div></div>' +
                    banner +
                    '<div class="detail-actions">' + downloadBtn +
                    '<button class="btn-ghost" id="share-btn-2" type="button">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4M12 2v14"/></svg>Share</button></div>' +
                    statsHtml + descHtml + screenshotsHtml + featuresHtml + changelogHtml +
                    '<div style="height:40px"></div>';
                attachDetailHandlers();
            }

            /* ═══════════════════════════════════════════════════════════════════════
               [JS-14] GENERATING PAGE
               ═══════════════════════════════════════════════════════════════════════ */
            function renderGenerating() {
                var view = $('#view');
                view.className = 'view view-generating';
                var app = state.genApp;
                if (!app) {
                    state.view = 'home';
                    renderHome();
                    return;
                }
                var elapsed = (performance.now() - state.genStart) / 1000;
                var remaining = Math.max(0, GEN_WAIT - elapsed);
                if (remaining <= 0) state.genReady = true;
                var versionTxt = app.version ? 'v' + app.version : '';
                var taglineParts = [];
                if (versionTxt) taglineParts.push(versionTxt);
                if (app.category) taglineParts.push(app.category);
                taglineParts.push('Premium Unlocked');
                var tagline = taglineParts.join(' · ');

                var headerCard =
                    '<div class="gen-header-card">' +
                    '<div class="gen-app-name">' + esc(app.name) + (versionTxt ? ' ' + esc(versionTxt) : '') + '</div>' +
                    '<div class="gen-app-tagline">' + esc(tagline) + '</div>' +
                    '</div>';

                var thanksHtml =
                    '<p class="gen-thanks">Thank you for downloading <span class="gen-hl">' + esc(app.name) +
                    '</span> from our site. Neeche available link hai — button dabate hi file automatically download shuru ho jayegi.</p>';

                var fileName = app.name + (versionTxt ? ' ' + versionTxt : '') + ' MOD APK';
                var progressPct = ((GEN_WAIT - remaining) / GEN_WAIT) * 100;
                var progressCard =
                    '<div class="gen-progress-card" id="gen-loading"' + (state.genReady ? ' hidden' : '') + '>' +
                    '<div class="gen-file-name">' + esc(fileName) + '</div>' +
                    '<div class="gen-progress-track"><div class="gen-progress-fill" id="gen-fill" style="width:' + progressPct + '%"></div></div>' +
                    '<div class="gen-status">' +
                    '<span>Download link ban raha hai…</span>' +
                    '<span class="gen-count"><span id="gen-count">' + Math.ceil(remaining) + '</span>s</span>' +
                    '</div>' +
                    '<button class="gen-report" type="button" id="gen-report">⚠ Download kaam nahi kar raha? Report karo</button>' +
                    '</div>';

                var readyCard =
                    '<div class="gen-ready-card" id="gen-ready"' + (state.genReady ? '' : ' hidden') + '>' +
                    '<div class="gen-ready-icon">✓</div>' +
                    '<h3 class="gen-ready-title">Download ready hai</h3>' +
                    '<p class="gen-ready-text">Neeche button dabao — download turant shuru hoga.</p>' +
                    '<button class="gen-download-btn" id="gen-download" type="button" ' +
                    'data-slug="' + esc(app.slug) + '">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v14M5 12l7 7 7-7M5 21h14"/></svg>' +
                    'Download APK' +
                    '</button>' +
                    '</div>';

                var cancelBtn = '<button class="gen-cancel" id="gen-cancel" type="button">Cancel karke wapas jao</button>';
                var noteHtml = '<div class="gen-note"><strong>Important:</strong> Install karne se pehle Android settings mein "Unknown sources se install" allow karna zaroori hai.</div>';

                view.innerHTML =
                    '<div class="gen-page">' +
                    '<div class="gen-container">' +
                    headerCard + thanksHtml + progressCard + readyCard + cancelBtn + noteHtml +
                    '</div>' +
                    '</div>';

                attachGeneratingHandlers();
            }

            /* ═══════════════════════════════════════════════════════════════════════
               [JS-15] HANDLERS
               ═══════════════════════════════════════════════════════════════════════ */
            function attachHomeHandlers() {
                var cats = $('#cats');
                if (cats) {
                    cats.addEventListener('click', function(e) {
                        var btn = e.target.closest('.cat');
                        if (!btn) return;
                        state.category = btn.getAttribute('data-cat');
                        renderHome();
                        window.scrollTo({
                            top: 0,
                            behavior: 'smooth'
                        });
                    });
                }
            }

            function attachDetailHandlers() {
                var readMore = $('#read-more');
                var descBody = $('#desc-body');
                if (readMore && descBody) {
                    requestAnimationFrame(function() {
                        if (descBody.scrollHeight > descBody.clientHeight + 4) readMore.hidden = false;
                    });
                    readMore.addEventListener('click', function() {
                        var clamped = descBody.classList.toggle('clamped');
                        readMore.textContent = clamped ? 'Read more' : 'Show less';
                    });
                }
                var dlBtn = $('#download-btn');
                if (dlBtn) {
                    dlBtn.addEventListener('click', function() {
                        var slug = dlBtn.getAttribute('data-slug') || state.slug;
                        startGenerating(slug);
                    });
                }
                var share = function() {
                    var url = location.href;
                    var title = state.detail ? state.detail.name : 'App';
                    if (navigator.share) navigator.share({
                        title: title,
                        url: url
                    }).catch(function() {});
                    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function() {
                        showToast('Link copy ho gaya');
                    }).catch(function() {
                        showToast(url);
                    });
                    else showToast(url);
                };
                var s1 = $('#share-btn'),
                    s2 = $('#share-btn-2');
                if (s1) s1.addEventListener('click', share);
                if (s2) s2.addEventListener('click', share);
            }

            function attachGeneratingHandlers() {
                var cancel = $('#gen-cancel');
                if (cancel) cancel.addEventListener('click', cancelGenerating);
                var report = $('#gen-report');
                if (report) {
                    report.addEventListener('click', function() {
                        showToast('Report bhej diya. Thanks!');
                    });
                }
                var goBtn = $('#gen-download');
                if (goBtn) {
                    goBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        handleFinalDownload(goBtn);
                    });
                }
                var escKeyHandler = function(e) {
                    if (e.key === 'Escape' && state.view === 'generating') {
                        cancelGenerating();
                        document.removeEventListener('keydown', escKeyHandler);
                    }
                };
                document.addEventListener('keydown', escKeyHandler);
            }

            /* ═══════════════════════════════════════════════════════════════════════
               [JS-16] GENERATING FLOW (RAF driven)
               ═══════════════════════════════════════════════════════════════════════ */
            function stopGeneratingTimer() {
                if (state.genRaf) {
                    cancelAnimationFrame(state.genRaf);
                    state.genRaf = null;
                }
            }

            function startGenerating(slug) {
                var app = state.detail;
                if (!app || app.slug !== slug) {
                    app = state.apps.filter(function(a) {
                        return a.slug === slug;
                    })[0];
                }
                if (!app) {
                    showToast('App nahi mila');
                    return;
                }
                stopGeneratingTimer();
                state.view = 'generating';
                state.genSlug = slug;
                state.genApp = app;
                state.genStart = performance.now();
                state.genReady = false;
                if (location.pathname !== '/p/' + encodeURIComponent(slug)) {
                    history.pushState({
                        slug: slug,
                        generating: true
                    }, '', '/p/' + encodeURIComponent(slug));
                }
                renderGenerating();
                window.scrollTo({
                    top: 0,
                    behavior: 'auto'
                });
                state.genRaf = requestAnimationFrame(tickGenerating);
            }

            function tickGenerating() {
                if (state.view !== 'generating') return;
                var elapsed = (performance.now() - state.genStart) / 1000;
                var remaining = Math.max(0, GEN_WAIT - elapsed);
                var progress = Math.min(100, (elapsed / GEN_WAIT) * 100);
                var fillEl = $('#gen-fill');
                var countEl = $('#gen-count');
                if (fillEl) fillEl.style.width = progress + '%';
                if (countEl) countEl.textContent = String(Math.ceil(remaining));
                if (remaining <= 0) {
                    if (!state.genReady) {
                        state.genReady = true;
                        renderGenerating();
                    }
                    return;
                }
                state.genRaf = requestAnimationFrame(tickGenerating);
            }

            function cancelGenerating() {
                stopGeneratingTimer();
                state.genReady = false;
                state.genStart = 0;
                if (state.genSlug) {
                    state.view = 'detail';
                    var slug = state.genSlug;
                    state.genSlug = null;
                    state.genApp = null;
                    loadAppDetail(slug);
                } else {
                    state.view = 'home';
                    state.genApp = null;
                    renderHome();
                }
            }

            /* ═══════════════════════════════════════════════════════════════════════
               [JS-17] FINAL DOWNLOAD — now direct from Firebase `download` field
               ═══════════════════════════════════════════════════════════════════════ */
            function handleFinalDownload(btnEl) {
                var app = state.genApp;
                if (!app) {
                    showToast('App info nahi hai');
                    return;
                }
                var url = safeUrl(app.download);
                if (!url) {
                    showToast('Is app ke liye download link available nahi hai');
                    return;
                }
                if (btnEl) {
                    btnEl.classList.add('is-loading');
                    btnEl.disabled = true;
                }
                // Trigger download
                window.location.href = url;
                setTimeout(function() {
                    if (btnEl) {
                        btnEl.classList.remove('is-loading');
                        btnEl.disabled = false;
                    }
                }, 1800);
            }

            /* ═══════════════════════════════════════════════════════════════════════
               [JS-18] ROUTER
               ═══════════════════════════════════════════════════════════════════════ */
            function parseRoute() {
                var path = location.pathname || '/';
                var m = path.match(/^\/p\/([^\/?#]+)/);
                if (m) return {
                    view: 'detail',
                    slug: decodeURIComponent(m[1])
                };
                return {
                    view: 'home'
                };
            }

            function navigate(route, push) {
                stopGeneratingTimer();
                state.genReady = false;
                state.genSlug = null;
                state.genApp = null;
                if (route.view === 'detail') {
                    if (push) {
                        var target = '/p/' + encodeURIComponent(route.slug);
                        if (location.pathname !== target) history.pushState({
                            slug: route.slug
                        }, '', target);
                    }
                    loadAppDetail(route.slug);
                    window.scrollTo({
                        top: 0,
                        behavior: 'auto'
                    });
                } else {
                    if (push && location.pathname !== '/appstore') history.pushState({}, '', '/appstore');
                    state.view = 'home';
                    state.slug = null;
                    state.detail = null;
                    renderHome();
                }
            }

            function interceptLinks() {
                document.addEventListener('click', function(e) {
                    var a = e.target.closest('a');
                    if (!a) return;
                    if (a.id === 'download-btn' || a.id === 'gen-download') return;
                    if (a.target === '_blank') return;
                    if (!a.hasAttribute('data-link')) return;
                    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
                    var href = a.getAttribute('href') || '';
                    if (!href) return;
                    e.preventDefault();
                    var m = href.match(/\/p\/([^\/?#]+)/);
                    if (m) navigate({
                        view: 'detail',
                        slug: decodeURIComponent(m[1])
                    }, true);
                    else navigate({
                        view: 'home'
                    }, true);
                });
            }

            window.addEventListener('popstate', function() {
                var route = parseRoute();
                if (state.view === 'generating') {
                    stopGeneratingTimer();
                    state.genReady = false;
                    state.genSlug = null;
                    state.genApp = null;
                }
                navigate(route, false);
            });

            /* ═══════════════════════════════════════════════════════════════════════
               [JS-19] SEARCH
               ═══════════════════════════════════════════════════════════════════════ */
            function initSearch() {
                var input = $('#search-input');
                var clearBtn = $('#search-clear');
                if (!input) return;
                var onInput = debounce(function() {
                    state.query = input.value;
                    clearBtn.hidden = !input.value;
                    if (state.view === 'home') renderHome();
                }, 140);
                input.addEventListener('input', onInput);
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        input.value = '';
                        state.query = '';
                        clearBtn.hidden = true;
                        if (state.view === 'home') renderHome();
                        input.blur();
                    }
                });
                clearBtn.addEventListener('click', function() {
                    input.value = '';
                    state.query = '';
                    clearBtn.hidden = true;
                    if (state.view === 'home') renderHome();
                    input.focus();
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === '/' && document.activeElement !== input) {
                        e.preventDefault();
                        input.focus();
                    }
                });
            }

            /* ═══════════════════════════════════════════════════════════════════════
               [JS-20] INIT
               ═══════════════════════════════════════════════════════════════════════ */
            function init() {
                initTheme();
                var tt = $('#theme-toggle');
                if (tt) tt.addEventListener('click', toggleTheme);
                initSearch();
                interceptLinks();
                var route = parseRoute();
                if (route.view === 'detail') {
                    if (!/^\/p\//.test(location.pathname)) {
                        history.replaceState({
                            slug: route.slug
                        }, '', '/p/' + encodeURIComponent(route.slug));
                    }
                    loadApps(false);
                    loadAppDetail(route.slug);
                } else {
                    if (location.pathname === '/') history.replaceState({}, '', '/appstore');
                    loadApps(false);
                }
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        })();
    </script>
</body>

</html>
