<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title>ModStore · Android App Marketplace</title>
    <meta name="description" content="Discover and download the latest Android apps from ModStore.">
    <meta name="theme-color" content="#080b10">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300e676'/%3E%3Cstop offset='1' stop-color='%2300d2ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M20 46V18h8l8 14 8-14h8v28h-7V30l-7 12h-4l-7-12v16z' fill='%23051614'/%3E%3C/svg%3E">

    <style>
        /* ═══════════════════════════════════════════════════════════════════════════
   [CSS-01] RESET
   ═══════════════════════════════════════════════════════════════════════════ */
        *,
        *::before,
        *::after {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            padding: 0
        }

        html {
            -webkit-text-size-adjust: 100%
        }

        img {
            max-width: 100%;
            display: block
        }

        button,
        input {
            font: inherit;
            color: inherit
        }

        button {
            background: none;
            border: 0;
            cursor: pointer
        }

        a {
            color: inherit;
            text-decoration: none
        }

        /* ═══════════════════════════════════════════════════════════════════════════
   [CSS-02] THEME TOKENS
   ═══════════════════════════════════════════════════════════════════════════ */
        :root {
            --bg: #080b10;
            --bg-soft: #0c1119;
            --surface: #10141c;
            --surface-2: #171b25;
            --surface-3: #1e2330;
            --border: rgba(255, 255, 255, .06);
            --border-strong: rgba(255, 255, 255, .11);
            --text: #ffffff;
            --text-dim: #c4cfe0;
            --text-mute: #7c8ba3;
            --accent: #00e676;
            --accent-2: #00d2ff;
            --accent-grad: linear-gradient(135deg, #00e676 0%, #00d2ff 100%);
            --accent-soft: rgba(0, 230, 118, .14);
            --accent-on: #051614;
            --accent-glow: rgba(0, 230, 118, .30);
            --accent-text: #00e676;
            --danger: #ef4444;
            --warn: #f59e0b;
            --success: #00e676;
            --r-sm: 12px;
            --r: 18px;
            --r-lg: 26px;
            --r-xl: 32px;
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, .32);
            --shadow: 0 10px 34px rgba(0, 0, 0, .48);
            --shadow-lg: 0 24px 70px rgba(0, 0, 0, .62);
            --header-h: 64px;
            --ease: cubic-bezier(.22, .8, .24, 1);
        }

        [data-theme="light"] {
            --bg: #eef2f7;
            --bg-soft: #e7ecf3;
            --surface: #ffffff;
            --surface-2: #eef2f7;
            --surface-3: #dde5ef;
            --border: rgba(12, 22, 45, .09);
            --border-strong: rgba(12, 22, 45, .16);
            --text: #0a1224;
            --text-dim: #414d67;
            --text-mute: #7c8ba3;
            --accent: #00a844;
            --accent-2: #008fc9;
            --accent-grad: linear-gradient(135deg, #00a844 0%, #008fc9 100%);
            --accent-soft: rgba(0, 168, 68, .12);
            --accent-on: #ffffff;
            --accent-glow: rgba(0, 168, 68, .28);
            --accent-text: #00743a;
            --shadow-sm: 0 2px 10px rgba(20, 32, 60, .08);
            --shadow: 0 10px 34px rgba(20, 32, 60, .12);
            --shadow-lg: 0 24px 70px rgba(20, 32, 60, .18);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            transition: background-color .3s var(--ease), color .3s var(--ease);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(900px 500px at 12% -8%, rgba(0, 230, 118, .10), transparent 60%),
                radial-gradient(800px 500px at 100% 0%, rgba(0, 210, 255, .08), transparent 55%);
        }

        [data-theme="light"] body::before {
            opacity: .6
        }

        ::selection {
            background: rgba(0, 230, 118, .28)
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
            border: 2px solid var(--bg)
        }

        .skip {
            position: absolute;
            left: -9999px;
            top: 0;
            background: var(--accent);
            color: var(--accent-on);
            padding: 10px 16px;
            z-index: 999
        }

        .skip:focus {
            left: 8px;
            top: 8px;
            border-radius: 8px
        }

        /* [CSS-04] HEADER */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--header-h);
            background: rgba(8, 11, 16, .82);
            -webkit-backdrop-filter: saturate(180%) blur(22px);
            backdrop-filter: saturate(180%) blur(22px);
            border-bottom: 1px solid var(--border);
            transition: background-color .3s var(--ease), border-color .3s var(--ease);
        }

        [data-theme="light"] .header {
            background: rgba(255, 255, 255, .85)
        }

        .header-inner {
            max-width: 1440px;
            height: 100%;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 12px
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            font-weight: 800;
            letter-spacing: -.02em;
            border-radius: 14px;
            padding: 4px;
            margin-left: -4px;
            transition: transform .2s var(--ease)
        }

        .brand:active {
            transform: scale(.96)
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 11px;
            background: var(--accent-grad);
            color: var(--accent-on);
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 17px;
            box-shadow: 0 6px 18px var(--accent-glow);
            flex-shrink: 0
        }

        .brand-name {
            font-size: 17px;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        @media (max-width:420px) {
            .brand-name {
                display: none
            }
        }

        .search {
            flex: 1;
            max-width: 520px;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center
        }

        .search-icon {
            position: absolute;
            left: 13px;
            width: 18px;
            height: 18px;
            color: var(--text-mute);
            pointer-events: none;
            transition: color .2s
        }

        .search input {
            width: 100%;
            height: 42px;
            padding: 0 40px;
            border-radius: 14px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            outline: none;
            font-size: 15px;
            transition: border-color .2s, background .2s, box-shadow .2s;
            -webkit-appearance: none;
            appearance: none
        }

        .search input::-webkit-search-cancel-button {
            display: none
        }

        .search input::placeholder {
            color: var(--text-mute)
        }

        .search input:focus {
            border-color: var(--accent);
            background: var(--surface);
            box-shadow: 0 0 0 4px var(--accent-soft)
        }

        .search:focus-within .search-icon {
            color: var(--accent)
        }

        .search-clear {
            position: absolute;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: var(--text-dim);
            background: var(--surface-3);
            font-size: 15px;
            line-height: 1
        }

        .search-clear:hover {
            color: var(--text);
            background: var(--border-strong)
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 13px;
            display: grid;
            place-items: center;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            transition: background .2s, color .2s, transform .15s var(--ease), border-color .2s
        }

        .icon-btn:hover {
            color: var(--text);
            background: var(--surface-3);
            border-color: var(--border-strong)
        }

        .icon-btn:active {
            transform: scale(.94)
        }

        .icon-btn svg {
            width: 19px;
            height: 19px
        }

        [data-theme="dark"] .icon-sun {
            display: none
        }

        [data-theme="light"] .icon-moon {
            display: none
        }

        /* [CSS-05] VIEW */
        #view {
            position: relative;
            z-index: 1;
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 0 60px;
            min-height: calc(100vh - var(--header-h))
        }

        .view-detail {
            padding-top: 0
        }

        .view-generating {
            padding: 0
        }

        /* [CSS-06] SECTION HEAD */
        .section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            padding: 4px 20px 14px;
            margin-top: 8px
        }

        .section-head h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -.025em
        }

        .section-head .count {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-mute);
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 3px 10px;
            border-radius: 999px
        }

        /* [CSS-07] BANNERS */
        .banner {
            margin: 0 20px 14px;
            padding: 11px 14px;
            border-radius: 13px;
            font-size: 13.5px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 9px
        }

        .banner-warn {
            background: rgba(245, 158, 11, .12);
            border: 1px solid rgba(245, 158, 11, .28);
            color: #fbbf24
        }

        .banner-info {
            background: var(--accent-soft);
            border: 1px solid rgba(0, 230, 118, .28);
            color: var(--accent)
        }

        [data-theme="light"] .banner-warn {
            color: #b45309
        }

        [data-theme="light"] .banner-info {
            color: var(--accent-text)
        }

        /* [CSS-08] HERO */
        .hero {
            position: relative;
            margin: 4px 16px 26px;
            border-radius: var(--r-xl);
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none
        }

        .hero-track {
            display: flex;
            transition: transform .55s var(--ease);
            will-change: transform
        }

        .hero-slide {
            flex: 0 0 100%;
            min-width: 100%;
            position: relative;
            min-height: 300px;
            display: flex;
            align-items: flex-end;
            overflow: hidden
        }

        .hero-bg {
            position: absolute;
            inset: -25%;
            background-size: cover;
            background-position: center;
            filter: blur(58px) saturate(160%);
            transform: scale(1.15);
            opacity: .62;
            pointer-events: none
        }

        .hero-shade {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(6, 8, 12, .18) 0%, rgba(6, 8, 12, .62) 52%, rgba(6, 8, 12, .94) 100%), linear-gradient(90deg, rgba(6, 8, 12, .72) 0%, rgba(6, 8, 12, .15) 62%);
            pointer-events: none
        }

        .hero-content {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 28px 24px;
            display: flex;
            align-items: flex-end;
            gap: 20px;
            color: #fff
        }

        .hero-icon {
            width: 82px;
            height: 82px;
            border-radius: 22px;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 14px 40px rgba(0, 0, 0, .55);
            border: 1px solid rgba(255, 255, 255, .16);
            background: rgba(255, 255, 255, .06)
        }

        .hero-text {
            min-width: 0;
            flex: 1
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .07em;
            text-transform: uppercase;
            color: #fff;
            background: rgba(255, 255, 255, .14);
            border: 1px solid rgba(255, 255, 255, .18);
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 10px;
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px)
        }

        .hero-badge .pulse {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 0 rgba(0, 230, 118, .6);
            animation: pulse 2s infinite
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 230, 118, .6)
            }

            70% {
                box-shadow: 0 0 0 8px rgba(0, 230, 118, 0)
            }

            100% {
                box-shadow: 0 0 0 0 rgba(0, 230, 118, 0)
            }
        }

        .hero-title {
            margin: 0 0 8px;
            font-size: clamp(24px, 5.4vw, 42px);
            font-weight: 900;
            letter-spacing: -.035em;
            line-height: 1.06;
            text-shadow: 0 4px 24px rgba(0, 0, 0, .5);
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical
        }

        .hero-desc {
            margin: 0 0 16px;
            font-size: clamp(13.5px, 2.6vw, 15.5px);
            color: rgba(255, 255, 255, .82);
            max-width: 560px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            text-shadow: 0 2px 14px rgba(0, 0, 0, .5)
        }

        .hero-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px
        }

        .chip-glass {
            font-size: 12px;
            font-weight: 600;
            padding: 5px 11px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .13);
            border: 1px solid rgba(255, 255, 255, .2);
            color: #fff;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px)
        }

        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            height: 46px;
            padding: 0 24px;
            border-radius: 15px;
            background: var(--accent-grad);
            color: var(--accent-on);
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 10px 30px var(--accent-glow);
            transition: transform .18s var(--ease), box-shadow .18s
        }

        .hero-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 38px var(--accent-glow)
        }

        .hero-cta:active {
            transform: translateY(0) scale(.97)
        }

        .hero-cta svg {
            width: 17px;
            height: 17px
        }

        .hero-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(10, 12, 18, .55);
            border: 1px solid rgba(255, 255, 255, .16);
            color: #fff;
            font-size: 22px;
            line-height: 1;
            z-index: 5;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity .25s, background .2s
        }

        .hero:hover .hero-nav {
            opacity: 1
        }

        .hero-nav:hover {
            background: rgba(10, 12, 18, .82)
        }

        .hero-prev {
            left: 14px
        }

        .hero-next {
            right: 14px
        }

        @media (hover:none) {
            .hero-nav {
                display: none
            }
        }

        .hero-dots {
            position: absolute;
            bottom: 16px;
            right: 22px;
            display: flex;
            gap: 6px;
            z-index: 5
        }

        .hero-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .36);
            transition: width .35s var(--ease), background .25s;
            padding: 0
        }

        .hero-dot.active {
            width: 22px;
            background: var(--accent)
        }

        @media (max-width:640px) {
            .hero {
                margin: 4px 12px 22px;
                border-radius: 24px
            }

            .hero-slide {
                min-height: 400px
            }

            .hero-content {
                padding: 22px 18px;
                flex-direction: column;
                align-items: flex-start;
                gap: 14px
            }

            .hero-icon {
                width: 66px;
                height: 66px;
                border-radius: 18px
            }

            .hero-dots {
                bottom: 14px;
                right: 18px
            }

            .hero-cta {
                width: 100%;
                justify-content: center
            }
        }

        /* [CSS-09] CATEGORIES */
        .cats {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 20px 20px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth
        }

        .cats::-webkit-scrollbar {
            display: none
        }

        .cat {
            flex-shrink: 0;
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 13.5px;
            font-weight: 600;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            white-space: nowrap;
            transition: background .2s, color .2s, border-color .2s, transform .15s var(--ease)
        }

        .cat:hover {
            color: var(--text);
            border-color: var(--border-strong)
        }

        .cat:active {
            transform: scale(.95)
        }

        .cat.active {
            background: var(--accent-grad);
            border-color: transparent;
            color: var(--accent-on);
            box-shadow: 0 6px 20px var(--accent-glow)
        }

        /* [CSS-10] GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            padding: 0 16px
        }

        @media (min-width:560px) {
            .grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 14px;
                padding: 0 20px
            }
        }

        @media (min-width:880px) {
            .grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 16px
            }
        }

        @media (min-width:1180px) {
            .grid {
                grid-template-columns: repeat(5, minmax(0, 1fr))
            }
        }

        @media (min-width:1480px) {
            .grid {
                grid-template-columns: repeat(6, minmax(0, 1fr))
            }
        }

        /* [CSS-11] APP CARD */
        .app-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            padding: 16px 12px 14px;
            border-radius: var(--r);
            background: var(--surface);
            border: 1px solid var(--border);
            transition: transform .22s var(--ease), border-color .22s, background .22s, box-shadow .22s;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent
        }

        .app-card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(160deg, rgba(0, 230, 118, .10), transparent 55%);
            opacity: 0;
            transition: opacity .22s;
            pointer-events: none
        }

        .app-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 230, 118, .38);
            box-shadow: 0 14px 34px rgba(0, 0, 0, .42)
        }

        .app-card:hover::after {
            opacity: 1
        }

        .app-card:active {
            transform: translateY(-1px) scale(.985)
        }

        .app-icon-wrap {
            position: relative;
            width: 62px;
            height: 62px;
            flex-shrink: 0;
            border-radius: 17px;
            overflow: hidden;
            background: var(--accent-grad);
            display: grid;
            place-items: center;
            box-shadow: 0 8px 22px rgba(0, 0, 0, .32)
        }

        @media (min-width:880px) {
            .app-icon-wrap {
                width: 68px;
                height: 68px;
                border-radius: 19px
            }
        }

        .app-icon-fallback {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 26px;
            color: var(--accent-on);
            letter-spacing: -.02em;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .15)
        }

        .app-icon {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit
        }

        .app-name {
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -.01em;
            width: 100%;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            word-break: break-word
        }

        .app-meta {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-mute);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
            max-width: 100%
        }

        .app-meta .dot {
            opacity: .5
        }

        .app-meta .cat-tag {
            color: var(--accent-text);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        /* [CSS-12] SKELETON */
        .sk {
            background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%);
            background-size: 220% 100%;
            animation: shimmer 1.4s ease-in-out infinite;
            border-radius: 8px
        }

        @keyframes shimmer {
            0% {
                background-position: 120% 0
            }

            100% {
                background-position: -120% 0
            }
        }

        .sk-hero {
            margin: 4px 16px 26px;
            height: 320px;
            border-radius: var(--r-xl)
        }

        @media (max-width:640px) {
            .sk-hero {
                height: 400px;
                margin: 4px 12px 22px
            }
        }

        .sk-chips {
            display: flex;
            gap: 8px;
            padding: 0 20px 20px;
            overflow: hidden
        }

        .sk-chip {
            height: 38px;
            width: 92px;
            border-radius: 999px;
            flex-shrink: 0
        }

        .sk-card {
            border-radius: var(--r);
            border: 1px solid var(--border);
            background: var(--surface);
            padding: 16px 12px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px
        }

        .sk-icon {
            width: 62px;
            height: 62px;
            border-radius: 17px
        }

        .sk-line {
            height: 11px;
            width: 78%
        }

        .sk-line.short {
            width: 48%
        }

        .sk-section-title {
            height: 18px;
            width: 150px;
            margin: 8px 20px 14px;
            border-radius: 8px
        }

        /* [CSS-13] EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px 24px 80px;
            max-width: 520px;
            margin: 0 auto
        }

        .empty-icon {
            width: 76px;
            height: 76px;
            border-radius: 24px;
            display: grid;
            place-items: center;
            margin: 0 auto 20px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            font-size: 34px
        }

        .empty-state h2 {
            margin: 0 0 8px;
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -.02em
        }

        .empty-state p {
            margin: 0 0 22px;
            color: var(--text-dim);
            font-size: 14.5px
        }

        .empty-state .diag {
            margin-top: 18px;
            text-align: left;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11.5px;
            color: var(--text-mute);
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 200px;
            overflow: auto
        }

        /* [CSS-14] BUTTONS */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            height: 48px;
            padding: 0 26px;
            border-radius: 15px;
            background: var(--accent-grad);
            color: var(--accent-on);
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 10px 28px var(--accent-glow);
            transition: transform .18s var(--ease), box-shadow .18s, opacity .2s
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 36px var(--accent-glow)
        }

        .btn-primary:active {
            transform: translateY(0) scale(.97)
        }

        .btn-primary:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none
        }

        .btn-primary svg {
            width: 18px;
            height: 18px
        }

        .btn-ghost {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            height: 48px;
            padding: 0 22px;
            border-radius: 15px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            font-weight: 700;
            font-size: 15px;
            transition: background .2s, border-color .2s, transform .15s var(--ease)
        }

        .btn-ghost:hover {
            background: var(--surface-3);
            border-color: var(--border-strong)
        }

        .btn-ghost:active {
            transform: scale(.97)
        }

        .btn-ghost svg {
            width: 18px;
            height: 18px
        }

        /* [CSS-15] DETAIL HERO */
        .detail-hero {
            position: relative;
            padding: 0 0 26px;
            overflow: hidden;
            isolation: isolate
        }

        .detail-hero-bg {
            position: absolute;
            inset: -30% -20% 0 -20%;
            background-size: cover;
            background-position: center;
            filter: blur(80px) saturate(170%);
            opacity: .5;
            z-index: -1;
            pointer-events: none
        }

        .detail-hero-shade {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(6, 8, 12, .55) 0%, rgba(6, 8, 12, .2) 40%, var(--bg) 100%);
            z-index: -1;
            pointer-events: none
        }

        [data-theme="light"] .detail-hero-shade {
            background: linear-gradient(180deg, rgba(255, 255, 255, .2) 0%, rgba(238, 242, 247, .7) 55%, var(--bg) 100%)
        }

        .detail-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            gap: 12px
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 42px;
            padding: 0 16px 0 13px;
            border-radius: 13px;
            background: rgba(10, 12, 18, .55);
            border: 1px solid rgba(255, 255, 255, .14);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            transition: background .2s, transform .15s var(--ease)
        }

        [data-theme="light"] .back-btn {
            background: rgba(255, 255, 255, .75);
            border-color: rgba(12, 22, 45, .1);
            color: var(--text)
        }

        .back-btn:hover {
            background: rgba(10, 12, 18, .75)
        }

        [data-theme="light"] .back-btn:hover {
            background: #fff
        }

        .back-btn:active {
            transform: scale(.96)
        }

        .back-btn svg {
            width: 17px;
            height: 17px
        }

        .detail-share {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            background: rgba(10, 12, 18, .55);
            border: 1px solid rgba(255, 255, 255, .14);
            color: #fff;
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            transition: background .2s, transform .15s var(--ease)
        }

        [data-theme="light"] .detail-share {
            background: rgba(255, 255, 255, .75);
            border-color: rgba(12, 22, 45, .1);
            color: var(--text)
        }

        .detail-share:hover {
            background: rgba(10, 12, 18, .75)
        }

        [data-theme="light"] .detail-share:hover {
            background: #fff
        }

        .detail-share:active {
            transform: scale(.94)
        }

        .detail-share svg {
            width: 18px;
            height: 18px
        }

        .detail-main {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            padding: 6px 20px 0;
            color: #fff
        }

        [data-theme="light"] .detail-main {
            color: var(--text)
        }

        @media (max-width:640px) {
            .detail-main {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px
            }
        }

        .detail-icon-wrap {
            width: 104px;
            height: 104px;
            flex-shrink: 0;
            border-radius: 26px;
            overflow: hidden;
            background: var(--accent-grad);
            display: grid;
            place-items: center;
            box-shadow: 0 18px 46px rgba(0, 0, 0, .55);
            border: 1px solid rgba(255, 255, 255, .16);
            position: relative
        }

        [data-theme="light"] .detail-icon-wrap {
            border-color: rgba(12, 22, 45, .08)
        }

        .detail-icon-wrap .app-icon-fallback {
            font-size: 44px
        }

        @media (max-width:640px) {
            .detail-icon-wrap {
                width: 84px;
                height: 84px;
                border-radius: 22px
            }

            .detail-icon-wrap .app-icon-fallback {
                font-size: 36px
            }
        }

        .detail-info {
            min-width: 0;
            flex: 1;
            padding-bottom: 4px
        }

        .detail-name {
            margin: 0 0 8px;
            font-size: clamp(24px, 5vw, 38px);
            font-weight: 900;
            letter-spacing: -.035em;
            line-height: 1.08;
            word-break: break-word
        }

        .detail-sub {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            font-weight: 600;
            color: rgba(255, 255, 255, .75)
        }

        [data-theme="light"] .detail-sub {
            color: var(--text-dim)
        }

        .detail-sub .sep {
            opacity: .4
        }

        .detail-sub .dev {
            color: var(--accent-text)
        }

        /* [CSS-16] DETAIL ACTIONS */
        .detail-actions {
            display: flex;
            gap: 10px;
            padding: 22px 20px 0;
            max-width: 560px
        }

        .detail-actions .btn-primary {
            flex: 1
        }

        @media (max-width:480px) {
            .detail-actions {
                flex-direction: column
            }

            .detail-actions .btn-ghost {
                width: 100%
            }
        }

        /* [CSS-17] STATS */
        .detail-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            margin: 24px 20px 0;
            border-radius: var(--r);
            background: var(--surface);
            border: 1px solid var(--border);
            overflow: hidden
        }

        .stat {
            padding: 16px 10px;
            text-align: center;
            border-right: 1px solid var(--border);
            min-width: 0
        }

        .stat:last-child {
            border-right: 0
        }

        .stat-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--text-mute);
            margin-bottom: 6px
        }

        .stat-value {
            font-size: 14px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        @media (max-width:560px) {
            .detail-stats {
                grid-template-columns: repeat(2, 1fr)
            }

            .stat:nth-child(2) {
                border-right: 0
            }

            .stat:nth-child(1),
            .stat:nth-child(2) {
                border-bottom: 1px solid var(--border)
            }
        }

        /* [CSS-18] DETAIL SECTIONS */
        .detail-section {
            padding: 28px 20px 0
        }

        .detail-section h2 {
            margin: 0 0 14px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -.02em
        }

        .detail-desc {
            margin: 0;
            font-size: 15px;
            line-height: 1.68;
            color: var(--text-dim);
            white-space: pre-wrap;
            word-break: break-word;
            max-width: 760px
        }

        .detail-desc.clamped {
            display: -webkit-box;
            -webkit-line-clamp: 6;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        .read-more {
            margin-top: 10px;
            color: var(--accent-text);
            font-weight: 700;
            font-size: 14px;
            padding: 4px 0
        }

        .shots {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 0 20px 8px;
            margin: 0 -20px;
            scroll-snap-type: x mandatory;
            scrollbar-width: none
        }

        .shots::-webkit-scrollbar {
            display: none
        }

        .shot {
            flex: 0 0 auto;
            width: 190px;
            aspect-ratio: 9/16;
            border-radius: 16px;
            object-fit: cover;
            background: var(--surface-2);
            border: 1px solid var(--border);
            scroll-snap-align: start
        }

        @media (min-width:700px) {
            .shot {
                width: 220px
            }
        }

        .feature-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 10px;
            max-width: 760px
        }

        .feature-list li {
            display: flex;
            align-items: flex-start;
            gap: 11px;
            font-size: 14.5px;
            color: var(--text-dim);
            line-height: 1.55
        }

        .feature-list li::before {
            content: "";
            flex-shrink: 0;
            width: 7px;
            height: 7px;
            margin-top: 8px;
            border-radius: 50%;
            background: var(--accent-grad)
        }

        .changelog {
            font-size: 14.5px;
            line-height: 1.68;
            color: var(--text-dim);
            white-space: pre-wrap;
            word-break: break-word;
            max-width: 760px;
            padding: 16px;
            border-radius: var(--r);
            background: var(--surface);
            border: 1px solid var(--border)
        }

        /* [CSS-19] GENERATING PAGE */
        .gen-page {
            min-height: calc(100vh - var(--header-h));
            background: var(--bg);
            color: var(--text-dim);
            padding: 24px 16px 40px;
            display: flex;
            justify-content: center;
            animation: genFade .35s var(--ease) both
        }

        @keyframes genFade {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        .gen-container {
            width: 100%;
            max-width: 520px
        }

        .gen-header-card {
            background: var(--accent-grad);
            color: var(--accent-on);
            border-radius: 20px;
            padding: 24px 22px;
            margin-bottom: 20px;
            box-shadow: 0 12px 40px var(--accent-glow);
            position: relative;
            overflow: hidden
        }

        .gen-header-card::after {
            content: "";
            position: absolute;
            inset: -50% -20% auto auto;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(255, 255, 255, .35), transparent 60%);
            pointer-events: none
        }

        .gen-app-name {
            font-size: clamp(22px, 5.4vw, 30px);
            font-weight: 900;
            letter-spacing: -.03em;
            line-height: 1.1;
            margin-bottom: 6px;
            word-break: break-word
        }

        .gen-app-tagline {
            font-size: 14px;
            font-weight: 700;
            opacity: .82;
            letter-spacing: -.01em
        }

        .gen-thanks {
            font-size: 15px;
            line-height: 1.65;
            color: var(--text-dim);
            margin: 0 0 20px;
            padding: 0 4px
        }

        .gen-thanks .gen-hl {
            color: var(--accent-text);
            font-weight: 800
        }

        .gen-progress-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px 20px;
            margin-bottom: 16px
        }

        .gen-file-name {
            font-size: 15.5px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 16px;
            letter-spacing: -.01em
        }

        .gen-progress-track {
            width: 100%;
            height: 12px;
            background: var(--surface-2);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 14px;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, .35)
        }

        .gen-progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: var(--accent-grad);
            box-shadow: 0 0 14px var(--accent-glow);
            will-change: width
        }

        .gen-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13.5px;
            color: var(--text-mute);
            font-weight: 600
        }

        .gen-count {
            color: var(--accent-text);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            font-size: 15px
        }

        .gen-report {
            display: block;
            width: 100%;
            margin-top: 14px;
            padding: 11px 14px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-mute);
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: color .2s, border-color .2s
        }

        .gen-report:hover {
            color: var(--text-dim);
            border-color: var(--border-strong)
        }

        .gen-ready-card {
            background: var(--surface);
            border: 2px solid var(--accent);
            border-radius: 18px;
            padding: 26px 22px 22px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: 0 0 30px var(--accent-glow);
            animation: genPop .45s var(--ease) both
        }

        @keyframes genPop {
            from {
                opacity: 0;
                transform: translateY(12px) scale(.96)
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1)
            }
        }

        .gen-ready-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: var(--accent-soft);
            border: 2px solid var(--accent);
            display: grid;
            place-items: center;
            color: var(--accent);
            font-size: 32px;
            font-weight: 900;
            animation: genPop .5s var(--ease) both
        }

        .gen-ready-title {
            margin: 0 0 8px;
            font-size: 19px;
            font-weight: 900;
            color: var(--text);
            letter-spacing: -.02em
        }

        .gen-ready-text {
            margin: 0 0 20px;
            font-size: 14px;
            color: var(--text-mute);
            line-height: 1.55
        }

        .gen-download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 17px 20px;
            border-radius: 14px;
            background: var(--accent-grad);
            color: var(--accent-on);
            font-weight: 900;
            font-size: 16px;
            text-decoration: none;
            box-shadow: 0 10px 32px var(--accent-glow);
            transition: transform .18s var(--ease), box-shadow .18s;
            letter-spacing: -.01em;
            border: 0;
            cursor: pointer
        }

        .gen-download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 40px var(--accent-glow)
        }

        .gen-download-btn:active {
            transform: translateY(0) scale(.98)
        }

        .gen-download-btn:disabled,
        .gen-download-btn.is-loading {
            opacity: .7;
            pointer-events: none
        }

        .gen-download-btn svg {
            width: 18px;
            height: 18px
        }

        .gen-cancel {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-mute);
            background: transparent;
            transition: color .2s, background .2s
        }

        .gen-cancel:hover {
            color: var(--text);
            background: var(--surface-2)
        }

        .gen-note {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 14px;
            background: var(--accent-soft);
            border: 1px solid rgba(0, 230, 118, .20);
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-dim)
        }

        .gen-note strong {
            color: var(--accent-text);
            font-weight: 800
        }

        /* [CSS-20] FOOTER */
        .footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 34px 20px 44px;
            border-top: 1px solid var(--border);
            margin-top: 40px
        }

        .footer p {
            margin: 0;
            font-size: 12.5px;
            color: var(--text-mute)
        }

        .footer a {
            color: var(--accent-text);
            font-weight: 600
        }

        /* [CSS-21] TOAST */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 26px;
            transform: translate(-50%, 90px);
            z-index: 300;
            background: var(--surface-3);
            color: var(--text);
            border: 1px solid var(--border-strong);
            padding: 12px 20px;
            border-radius: 14px;
            font-size: 13.5px;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transition: transform .35s var(--ease), opacity .3s;
            pointer-events: none;
            max-width: calc(100vw - 40px);
            text-align: center
        }

        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1
        }

        /* [CSS-22] ANIMATIONS */
        .fade-in {
            animation: fadeIn .4s var(--ease) both
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @media (prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important
            }
        }
    </style>
</head>

<body>

    <a class="skip" href="#view">Skip to content</a>

    <header class="header">
        <div class="header-inner">
            <a class="brand" href="/appstore" data-link aria-label="ModStore home">
                <span class="brand-mark">M</span>
                <span class="brand-name">ModStore</span>
            </a>
            <div class="search" role="search">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m20 20-3.5-3.5" />
                </svg>
                <input id="search-input" type="search" placeholder="Search apps…" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search apps">
                <button class="search-clear" id="search-clear" type="button" aria-label="Clear search" hidden>✕</button>
            </div>
            <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />

        /* ═══════════════════════════════════════════════════════════════════════════

        (function() {

                detailLoading: false,
                genSlug: null,
                genApp: null,

                genReady: false,
                genRaf: null,

            /* [JS-03] HELPERS */
            function $(s, r) {
                return (r || document).querySelector(s);
            }

            }

            function esc(s) {
                return String(s == null ? '' : s)

            }

            function safeUrl(u) {
                if (!u) return null;
                try {
                    var url = new URL(String(u), location.href);
                    if (url.protocol === 'http:' || url.protocol === 'https:') return url.href;
                    return null;
                } catch (e) {
                    return null;
                }
            }

            function debounce(fn, ms) {
                var t;

                    var a = arguments,
                        c = this;
                    clearTimeout(t);
                    t = setTimeout(function() {
                        fn.apply(c, a);
                    }, ms);
                };
            }

            function logDiag(msg) {
                state.diagnostics.push(String(msg));

            }

            /* [JS-04] THEME */
            function initTheme() {
                var saved = null;
                try {
                    saved = localStorage.getItem(LS_THEME);
                } catch (e) {}

                try {
                    prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                } catch (e) {}
                applyTheme(saved || (prefersDark ? 'dark' : 'light'));
            }

            function applyTheme(t) {
                document.documentElement.setAttribute('data-theme', t);
                var m = document.querySelector('meta[name="theme-color"]');
                if (m) m.setAttribute('content', t === 'dark' ? '#080b10' : '#eef2f7');

            function toggleTheme() {
                var cur = document.documentElement.getAttribute('data-theme');

            /* [JS-05] CACHE */
            function readAppsCache() {
                try {
